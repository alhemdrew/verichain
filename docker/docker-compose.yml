version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: verichain
      POSTGRES_PASSWORD: verichain_pass
      POSTGRES_DB: verichain_dev
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build:
      context: ../apps/api
    environment:
      DATABASE_URL: postgresql://verichain:verichain_pass@db:5432/verichain_dev
      ENV: development
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY before docker compose up}
      FRONTEND_URL: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173
      SEED_DEMO_ACCOUNTS: "false"
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  db_data:
